<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Corner panel fixture</title><style>body{margin:0;font:15px/1.7 system-ui;background:#fffefb;color:#35463e}.toolbar{padding:16px;background:#edf2eb;display:flex;gap:12px;flex-wrap:wrap;align-items:center}main{max-width:760px;margin:80px auto;padding:24px}h1{font-size:40px;line-height:1.25}button{padding:8px 14px}output{font-size:12px}pre{font-size:12px;white-space:pre-wrap}</style></head><body><div class="toolbar"><button id="open">コマンドでパネルを開く</button><label>保存応答 <select id="mode"><option value="sent">保存済み</option><option value="pending">PC送信待ち</option><option value="error">接続エラー</option></select></label><label><input id="hold" type="checkbox">送信保留</label><button id="finish">保留送信を完了</button><output id="metrics"></output></div><main><p>FIELD NOTES · OCTOBER 2026</p><h1>余白を残す、資料を残す。</h1><p>これは実ブラウザ用の取得対象です。ページを読んだまま、右下の小さなパネルへメモを残せます。</p><p>この本文と見出しだけが取得され、パネルや書き込んだメモはページ本文・HTML・画像へ混入しません。</p><button id="page-focus">ページ側のフォーカス確認</button></main><pre id="checks">パネルを開いて検証してください。</pre><script type="module">
import { mountPanel } from '/panel.js';
import { handlePanelMessage } from '/worker.js';
const token='fixture-session',documentId='fixture-document',tab={id:1,windowId:1,url:location.href},sender={id:'fixture-extension',frameId:0,documentId,tab,url:location.href};
const data={local:{},session:{'panel:1':{token,tabId:1,documentId,url:location.href,time:performance.timeOrigin}}},listeners=[],waiting=[];let saves=0,screenshotClean=false;
const storage=area=>({get:async keys=>Object.fromEntries((Array.isArray(keys)?keys:[keys]).map(key=>[key,structuredClone(data[area][key])])),set:async values=>{const changes={};for(const[key,value]of Object.entries(values)){data[area][key]=structuredClone(value);changes[key]={newValue:structuredClone(value)};}if(area==='local')setTimeout(()=>listeners.forEach(fn=>fn(changes,'local')),0);},remove:async key=>{delete data[area][key];}});
const api={storage:{local:storage('local'),session:storage('session'),onChanged:{addListener:fn=>listeners.push(fn),removeListener:fn=>{const i=listeners.indexOf(fn);if(i>=0)listeners.splice(i,1);}}},action:{setBadgeText:async({text})=>{document.querySelector('#metrics').textContent=`保存 ${saves}回 / Badge ${text}`;},setBadgeBackgroundColor:async()=>{}},tabs:{get:async()=>tab,query:async()=>[tab],captureVisibleTab:async()=>{screenshotClean=globalThis.__knowledgeCapturePanel.host.style.display==='none';return 'data:image/jpeg;base64,YWJj';}},scripting:{executeScript:async request=>[{documentId,result:await request.func(...(request.args||[]))}]},runtime:{id:'fixture-extension',connectNative:()=>{let receive,disconnect,closed=false;return{onMessage:{addListener:fn=>{receive=fn;}},onDisconnect:{addListener:fn=>{disconnect=fn;}},disconnect:()=>{closed=true;},postMessage:message=>{const finish=()=>{if(closed)return;const mode=document.querySelector('#mode').value;if(mode==='error'){api.runtime.lastError={message:'fixture disconnected'};disconnect();api.runtime.lastError=undefined;return;}receive(message.action==='save'?{durable:true,state:mode,operation_id:message.capture.operation_id}:message.action==='sync'?{results:[{state:mode,operation_id:message.operation_id,reason:'GH_REQUEST_FAILED'}]}:{pending:0});};if(message.action==='save'){saves++;window.lastSaved=structuredClone(message.capture);const captureText=JSON.stringify({content:message.capture.content,html:message.capture.html});document.querySelector('#checks').textContent=`保存 ${saves}回\n画像からパネルを除外: ${screenshotClean}\nHTMLからパネルを除外: ${!captureText.includes('KNOWLEDGE CAPTURE')}\nメモから本文への混入なし: ${!message.capture.note || !captureText.includes(message.capture.note)}\nメモ: ${message.capture.note}`;}if(document.querySelector('#hold').checked)waiting.push(finish);else setTimeout(finish,120);}};}}};
// Fixture-only open root supports semantic browser controls. Production always requests closed.
function open(){const attach=Element.prototype.attachShadow;Element.prototype.attachShadow=function(options){return attach.call(this,{...options,mode:'open'});};try{mountPanel(token);}finally{Element.prototype.attachShadow=attach;}}
window.chrome={...api,runtime:{sendMessage:message=>handlePanelMessage(api,message,sender).catch(error=>({state:'error',reason:error.message}))}};
document.querySelector('#open').onclick=open;
document.querySelector('#finish').onclick=()=>{document.querySelector('#hold').checked=false;waiting.splice(0).forEach(fn=>fn());};
document.addEventListener('keydown',event=>{if(event.isTrusted&&(event.metaKey||event.ctrlKey)&&event.shiftKey&&event.key.toLowerCase()==='y'){event.preventDefault();open();}});
open();
</script></body></html>
