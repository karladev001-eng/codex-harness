schema_version: "1.1"
name: delegate-implementation
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 40
  timeout_seconds: 900
  allowed_tools: [Read, Glob, Grep, Skill, Bash, Write, Edit, Agent]
  prompt: |
    前回提示した仕様のとおり実装を承認します。進めてください。

    仕様（提示済み・承認済み）:
    - 目的: `calc.js` に `subtract(a, b)` と `multiply(a, b)` を追加し、`calc.test.js` にテストを書く。
    - 対象外: `add` の変更、依存パッケージの追加。
    - 受入条件: 1. `subtract(5, 3)` が `2` を返す。2. `multiply(4, 3)` が `12` を返す。3. `npm test` が成功する。
