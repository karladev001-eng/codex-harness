name: Portable runtime and package
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm pack
      - if: always() && runner.os == 'Windows'
        continue-on-error: true
        shell: bash
        run: |
          set +e +o pipefail
          for n in 'origin identity' 'read-only unresolved' 'worktrees inherit' 'non-Git registration' 'registry CAS' 'portable explicit' 'separate Git metadata'; do
            node --test --test-reporter=tap --test-name-pattern="$n" tests/identity.test.cjs > diag.txt 2>&1; echo "== $n => $?"; grep -E "^not ok|^  error:|^    [A-Za-z]" diag.txt | head -8
          done
