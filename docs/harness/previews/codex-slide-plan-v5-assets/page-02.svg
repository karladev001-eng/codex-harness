<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-label="平均時間は15秒短い"><rect width="1280" height="720" fill="#fff"/><g font-family="Arial, sans-serif" fill="#243246"><text x="76" y="66" font-size="17" fill="#176b70">BATCH PROCESSING · デザイン提案</text><text x="76" y="147" font-size="46" font-weight="700">平均時間は15秒短い</text><text x="76" y="320" font-size="134" font-weight="700" fill="#176b70">15秒</text><text x="445" y="307" font-size="35">平均時間の差</text><text x="76" y="430" font-size="25">現行</text><rect x="225" y="400" width="640" height="40" rx="4" fill="#d8e0e5"/><text x="900" y="431" font-size="30">40秒</text><text x="76" y="512" font-size="25">改善案</text><rect x="225" y="482" width="400" height="40" rx="4" fill="#176b70"/><text x="660" y="513" font-size="30" fill="#176b70">25秒</text><text x="76" y="597" font-size="20" fill="#566777">同じPC・各方式3回の平均を比較</text><path d="M76 643H1204" stroke="#d4dfe5"/><text x="76" y="675" font-size="16" fill="#566777">演習用仮想値。実測結果ではありません。</text><text x="1204" y="675" text-anchor="end" font-size="16" fill="#566777">02 / 04</text></g></svg>