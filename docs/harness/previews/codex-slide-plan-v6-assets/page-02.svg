<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-label="平均時間は15秒短い。演習用仮想値の現行40秒、改善案25秒の棒グラフ"><rect width="1280" height="720" fill="#fff"/><g font-family="Arial, sans-serif" fill="#243246"><text x="76" y="66" font-size="17" fill="#176b70">BATCH PROCESSING · デザイン提案</text><text x="76" y="147" font-size="46" font-weight="700">平均時間は15秒短い</text><text x="225" y="231" font-size="22" fill="#566777">平均時間（秒）</text><path d="M225 259V497" stroke="#a8b4bd" stroke-width="2"/><text x="76" y="320" font-size="29">現行</text><rect x="225" y="272" width="720" height="72" rx="4" fill="#d8e0e5"/><text x="972" y="321" font-size="36" font-weight="700">40秒</text><text x="76" y="438" font-size="29">改善案</text><rect x="225" y="390" width="450" height="72" rx="4" fill="#176b70"/><text x="702" y="439" font-size="36" font-weight="700" fill="#176b70">25秒</text><g font-size="20" fill="#566777" text-anchor="middle"><text x="225" y="529">0</text><text x="405" y="529">10</text><text x="585" y="529">20</text><text x="765" y="529">30</text><text x="945" y="529">40</text></g><text x="76" y="597" font-size="20" fill="#566777">同じPC・各方式3回の平均を比較</text><path d="M76 643H1204" stroke="#d4dfe5"/><text x="76" y="675" font-size="16" fill="#566777">演習用仮想値。実測結果ではありません。</text><text x="1204" y="675" text-anchor="end" font-size="16" fill="#566777">02 / 04</text></g></svg>